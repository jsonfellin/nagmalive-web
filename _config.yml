title: NagmaLive
description: "NagmaLive — The ultimate Indian classical music practice companion for Tabla, Kathak, and Lehra."
url: "https://nagmalive.com"
baseurl: ""
permalink: /blog/:title/

logo: /assets/images/app-icon.png

# GA4 Measurement ID. The tag only loads in production builds (GitHub Pages sets JEKYLL_ENV=production).
google_analytics: G-W3C64W55J7

author:
  name: NagmaLive
  type: Organization
  email: support@nagmalive.com
  twitter: nagmalive

twitter:
  username: nagmalive
  card: summary_large_image

social:
  name: NagmaLive
  links:
    - https://www.facebook.com/nagmalive
    - https://www.youtube.com/@nagmalive
    - https://x.com/nagmalive

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "NagmaLive"
      image: /assets/images/og-card.png
  - scope:
      path: ""
    values:
      layout: "page"
      image: /assets/images/og-card.png
  - scope:
      path: "index.html"
    values:
      layout: "default"
      image: /assets/images/og-card.png

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - LICENSE
  - node_modules
  - vendor
