{%- comment -%}
  Page-specific JSON-LD that jekyll-seo-tag doesn't generate.
  Home: the app itself. FAQs: FAQPage built from _data/faqs.yml.
{%- endcomment -%}
{%- if page.url == '/' -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MobileApplication",
  "name": "NagmaLive",
  "description": {{ page.description | jsonify }},
  "url": {{ site.url | jsonify }},
  "image": {{ '/assets/images/app-icon.png' | absolute_url | jsonify }},
  "applicationCategory": "MusicApplication",
  "operatingSystem": "iOS, Android",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "installUrl": [
    "https://apps.apple.com/app/id967589706",
    "https://play.google.com/store/apps/details?id=com.nagmalive.nagmaliveandroid"
  ],
  "publisher": { "@type": "Organization", "name": {{ site.author.name | jsonify }}, "url": {{ site.url | jsonify }} }
}
</script>
{%- elsif page.url == '/faqs/' -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {%- for faq in site.data.faqs %}
    {
      "@type": "Question",
      "name": {{ faq.question | strip_html | jsonify }},
      "acceptedAnswer": { "@type": "Answer", "text": {{ faq.answer | strip_html | jsonify }} }
    }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
{%- endif -%}
